<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcards HSK &amp; DELE</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, focused study companion
   IDEA: a paper index card stamped with a seal once you know the word
   PICTURE: the study card; home shows today's work as one large number
   COLOUR and TYPE: white paper, warm ink, one pink accent; Be Vietnam Pro + Noto Serif SC
   LAYOUT: home (today, levels, forecast) and a full-screen study session; sidebar on desktop, tab bar on phones */
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:light;
--soft:#f7f4f1;--ink:#16130f;--ink2:#4d4740;--muted:#6b655d;--faint:#968f86;--line:#e7e2da;--line2:#efebe5;
--pink:#d6336c;--pink-ink:#b5235a;--pink-soft:#fff0f5;--pink-line:#f6c4d5;--pink-mid:#f48fb1;
--zh:"Noto Serif SC","Songti SC",serif;--sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{background:#faf7f2 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")!important;color:var(--ink)}
body{margin:0;font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:#16130f!important;-webkit-text-fill-color:#16130f;background:#fff!important;color-scheme:light}
input::placeholder,textarea::placeholder{color:#968f86!important;-webkit-text-fill-color:#968f86}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:8px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:18px;height:18px}
.zh-t{font-family:var(--zh)}
kbd{font:600 11px/1 var(--sans);border:1px solid currentColor;border-radius:5px;padding:2px 5px;opacity:.55;margin-left:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app shell ---------- */
.app{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.side{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#faf7f2 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint);min-height:48px;position:relative}
.tabbar button.on{color:var(--ink);font-weight:700}
.tabbar button.on::after{content:"";position:absolute;bottom:-4px;width:5px;height:5px;border-radius:50%;background:var(--pink)}
.badge{position:absolute;top:-2px;left:calc(50% + 4px);background:var(--pink);color:#fff;font-size:11px;font-weight:700;line-height:17px;border-radius:99px;padding:0 6px;border:2px solid #fff}
.view{max-width:1120px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 24px}
.view[hidden]{display:none}
@media(min-width:1024px){
  .app{display:grid;grid-template-columns:248px minmax(0,1fr);padding-bottom:0}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line2);padding:26px 18px}
  .view{padding:32px 40px 48px;width:100%}
  .m-only{display:none!important}
}
@media(max-width:1023px){.d-only{display:none!important}}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:0 8px;letter-spacing:-.01em}
.brand i{font:700 15px/1 var(--zh);font-style:normal;color:var(--pink);border:1.5px solid var(--pink);border-radius:5px;width:28px;height:28px;display:grid;place-items:center;transform:rotate(-4deg)}
.langs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:2px}
.langs button{font-size:14px;font-weight:600;color:var(--muted);padding:9px 6px;border-radius:9px;min-height:40px}
.langs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,19,15,.08)}
.nav{display:grid;gap:2px;border-top:1px solid var(--line2);padding-top:16px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:500;color:var(--muted);min-height:44px;position:relative;text-align:left}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--soft);color:var(--ink);font-weight:700}
.nav .badge{position:static;margin-left:auto;border:0}
.side .foot{margin-top:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:0 8px}
.side .foot b{color:var(--pink-ink)}

/* ---------- shared bits ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0;display:inline-block;padding-bottom:7px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 20' preserveAspectRatio='none'><path d='M2 13 C40 6 90 4 140 8 S190 12 198 9 L197 13 C160 15 120 12 80 13 S20 17 3 16Z' fill='%23d6336c' fill-opacity='.85'/></svg>") no-repeat left bottom/100% 9px}
.head .sub{font-size:14px;color:var(--muted);margin-top:4px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--pink-ink);background:var(--pink-soft);border-radius:99px;padding:5px 11px;white-space:nowrap}
.panel{border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:#fff}
.panel h2{font-size:13px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 small{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;border:1.5px solid var(--ink);white-space:nowrap}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.primary:hover{background:var(--pink-ink);border-color:var(--pink-ink)}
.btn.ghost{border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink2)}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:15px;list-style:none}
.mobile-langs{margin-bottom:16px}

/* ---------- home ---------- */
.home-grid{display:grid;gap:16px}
@media(min-width:1024px){.home-grid{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.col{display:grid;gap:16px;align-content:start}
.today{position:relative;overflow:hidden;background:#fff;border:1px solid #f1d5df;border-radius:22px;padding:20px}
.today>*{position:relative;z-index:1}
.today::after{content:attr(data-seal);position:absolute;right:-8px;bottom:-40px;font:700 180px/1 var(--zh);letter-spacing:-.06em;color:var(--pink);opacity:.07;pointer-events:none;z-index:0}
.today .n{font-size:60px;font-weight:700;line-height:1;letter-spacing:-.04em}
.today .n small{font-size:17px;font-weight:500;letter-spacing:0;color:var(--ink2);margin-left:8px}
.today .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px;color:var(--ink2)}
.today .meta span{display:inline-flex;align-items:center;gap:6px}
.today .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.today .acts .btn{flex:1 1 200px;min-height:52px;font-size:16px}
.today.done .n{font-size:28px;letter-spacing:-.02em}
@media(min-width:1024px){.today{padding:26px 28px}.today .row{display:flex;align-items:center;justify-content:space-between;gap:20px}.today .acts{margin-top:0;flex:none}.today .acts .btn{flex:none;min-width:210px}}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lv{position:relative;text-align:left;border:1px solid var(--line);border-top:4px solid var(--lc,var(--line));border-radius:14px;padding:12px 14px 14px;min-height:88px;background:#fff;transition:border-color .15s}
.lv:hover{border-color:var(--ink2)}
.lv b{font-size:16px;font-weight:700;display:block;color:var(--lc,var(--ink))}
.lv small{font-size:12px;color:var(--muted)}
.lv .bar{height:5px;background:var(--line2);border-radius:9px;margin-top:10px;overflow:hidden}
.lv .bar i{display:block;height:100%;background:var(--lc,var(--ink));border-radius:9px}
.lv .tag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px}
.lv .tag.due{background:var(--pink);color:#fff}
.lv .tag.cur{background:var(--soft);color:var(--ink2)}
.lv.current{border-color:var(--lc,var(--pink));box-shadow:inset 0 0 0 1px var(--lc,var(--pink))}
.fc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:116px;align-items:end}
.fc div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--faint)}
.fc i{width:100%;max-width:34px;background:var(--line);border-radius:5px 5px 2px 2px;min-height:3px}
.fc div:first-child i{background:var(--pink)}
.fc b{font-size:12px;color:var(--ink);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:280px}
.heat span{aspect-ratio:1;border-radius:5px;background:var(--line2)}
.heat .h1{background:#fbd3e1}.heat .h2{background:var(--pink-mid)}.heat .h3{background:var(--pink)}
.heat .now{outline:2px solid var(--ink);outline-offset:1px}
.heat .dow{background:none;aspect-ratio:auto;font-size:10px;color:var(--faint);text-align:center}
.streakline{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.streakline b{font-size:30px;font-weight:700;letter-spacing:-.02em}
.wod{text-align:center}
.wod .w{font-size:40px;font-weight:700;line-height:1.2}
.wod .p{font-weight:600;color:var(--pink-ink)}
.wod .m{color:var(--ink2);font-size:15px;margin-top:2px}
.wod .row{display:flex;gap:8px;justify-content:center;margin-top:12px}
.wod .row .btn{min-height:40px;padding:0 14px;font-size:14px}

/* ---------- lists (search, starred, stats) ---------- */
.search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;min-height:50px;background:#fff}
.search:focus-within{border-color:var(--ink2)}
.search input{flex:1;border:0;outline:0;font-size:16px;min-height:46px}
.rows{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line2)}
.rows li{border-bottom:1px solid var(--line2)}
.rows button.r{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;text-align:left;padding:12px 4px;min-height:56px}
.rows button.r:hover{background:var(--soft)}
.rows .w{font-size:22px;font-weight:700;grid-row:span 2;min-width:3.2em}
.rows .t{font-size:13px;color:var(--pink-ink);font-weight:600}
.rows .v{font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .lvl{font-size:12px;color:var(--faint);grid-row:span 2}
.stats{display:grid;gap:16px}
@media(min-width:900px){.stats{grid-template-columns:1fr 1fr}}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:15px;color:var(--ink2)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.lvtable{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;font-size:14px}
.lvtable .bar{height:6px;background:var(--line2);border-radius:9px;overflow:hidden}.lvtable .bar i{display:block;height:100%;background:var(--lc,var(--ink))}
.lvtable b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.field input[type=number]{width:90px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;text-align:center}
.field select{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);min-height:44px}
.stack{display:grid;gap:16px;max-width:720px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
textarea.code{width:100%;height:96px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,monospace}
.src{font-size:13px;color:var(--muted);line-height:1.6;margin:0}.src a{color:var(--ink2)}

/* ---------- card (session and word sheet) ---------- */
.card{position:relative;border:1.5px solid var(--line);border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:58px 22px 66px;min-height:360px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.card::before{content:"";position:absolute;left:22px;right:22px;top:46px;border-top:2px solid var(--lc,var(--pink-line))}
.card .cno{position:absolute;top:15px;left:22px;font-size:12px;font-weight:700;color:var(--lc,var(--faint));letter-spacing:.04em}
.card .star{position:absolute;top:4px;right:8px;width:44px;height:44px;display:grid;place-items:center;color:#cfc8bf}
.card .star.on{color:var(--pink)}.card .star.on .ic{fill:var(--pink)}
.card .say{position:absolute;left:14px;bottom:14px;width:44px;height:44px;border:1.5px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.card .seal{position:absolute;right:16px;bottom:14px;min-width:46px;height:46px;padding:0 6px;border:2px solid var(--pink);color:var(--pink);border-radius:6px;display:grid;place-items:center;font:700 22px/1 var(--zh);transform:rotate(-6deg)}
.card .seal.es{font:700 15px/1 var(--sans)}
.big-zh{font:700 clamp(72px,22vw,108px)/1.05 var(--zh)}
.big-zh.grid{display:flex;justify-content:center}
.big-zh.grid span{width:1.4em;height:1.4em;display:grid;place-items:center;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='1' y='1' width='98' height='98' fill='none' stroke='%23f2b8cb' stroke-width='1.5'/><path d='M50 1V99M1 50H99M1 1L99 99M99 1L1 99' stroke='%23f6c9d8' stroke-width='1' stroke-dasharray='4 4'/></svg>") center/100% 100% no-repeat}
.big-zh.grid span+span{margin-left:-1px}
.big-zh.n3{font-size:clamp(54px,15vw,88px)}.big-zh.n4{font-size:clamp(40px,11.5vw,72px)}
.big-es{font-size:clamp(34px,10vw,52px);font-weight:700;line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere}
.big-es.ruled{padding:0 .3em .12em;background:linear-gradient(var(--pink-line),var(--pink-line)) left bottom/100% 2px no-repeat}
.big-es small{font-weight:500;color:var(--faint);font-size:.6em;margin-right:.25em}
.hint{margin-top:14px;font-size:13px;color:var(--faint)}
.b-top{font-size:22px;font-weight:500;color:var(--pink-ink)}
.b-pos{font-size:13px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:99px;padding:2px 12px;margin-bottom:8px}
.b-zh{font:700 56px/1.15 var(--zh);margin:2px 0 4px}
.b-es{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px;overflow-wrap:anywhere}
.b-hv{font-size:14px;color:var(--muted)}.b-hv b{color:var(--ink);font-weight:600}
.b-vi{font-size:19px;font-weight:600;margin-top:8px;max-width:44ch}
.b-ex{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;text-align:left;width:100%;max-width:520px;font-size:15px;line-height:1.45}
.b-ex .z{font-family:var(--zh);font-size:18px}.b-ex .p{font-size:12px;color:var(--faint)}.b-ex .t{color:var(--ink2);margin-top:2px}
.b-ex .t em{font-style:normal;font-size:11px;font-weight:700;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px}
.listen{width:96px;height:96px;border-radius:50%;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center}
.listen .ic{width:40px;height:40px}
.typing{display:flex;gap:8px;margin-top:18px;width:100%;max-width:380px}
.typing input{flex:1;min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:18px}
.typing input:focus{border-color:var(--ink2);outline:0}
.result{margin-top:12px;font-weight:700}.result.ok{color:#1b7f4b}.result.bad{color:var(--pink-ink)}

/* ---------- session (full screen) ---------- */
.session{position:fixed;inset:0;z-index:40;background:#faf7f2 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");display:none;overflow:auto}
.session.open{display:block}
.s-wrap{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
.s-top{display:flex;align-items:center;gap:12px}
.s-close{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;font-weight:600;color:var(--ink2)}
.s-prog{flex:1;height:8px;background:var(--line2);border-radius:9px;overflow:hidden}
.s-prog i{display:block;height:100%;background:var(--pink);border-radius:9px;transition:width .3s}
.s-count{font-size:14px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.s-sub{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 10px;font-size:13px;color:var(--muted)}
.modes{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex:none}
.modes button{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:8px;min-height:36px}
.modes button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,19,15,.08)}
.s-stage{position:relative;flex:1;display:flex;flex-direction:column}
.s-stage .card{flex:1;min-height:380px;will-change:transform}
.card.drag{transition:none}.card.back{transition:transform .25s ease-out}
.card.pop{animation:pop .22s ease-out}
@keyframes pop{50%{transform:scale(.985)}}
.swipe{position:absolute;top:44%;z-index:2;font-weight:700;font-size:15px;padding:6px 12px;border-radius:10px;opacity:0;pointer-events:none}
.swipe.l{left:10px;border:2px solid var(--ink);color:var(--ink);background:#fff}.swipe.r{right:10px;background:var(--pink);color:#fff}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.grade button{min-height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:16px}
.grade small{font-size:11px;font-weight:500;opacity:.75}
.grade .gt{display:flex;align-items:center}
.more{margin-top:6px;font-size:13px;font-weight:600;color:var(--pink-ink);min-height:36px;padding:0 10px;border-radius:8px}
.more:hover{background:var(--pink-soft)}
.grade .no{border:1.5px solid var(--ink)}
.grade .yes{background:var(--pink);color:#fff}
.grade .yes:disabled{opacity:.35;cursor:default}
.grade .one{grid-column:1/-1;background:var(--ink);color:#fff}
.s-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--faint);gap:8px}
.s-foot button{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 8px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:14px}
.s-foot button:disabled{opacity:.35;cursor:default}
.s-cheer{min-height:20px;text-align:center;font-size:14px;font-weight:600;color:var(--pink-ink);margin-top:6px}
.endbox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:20px 10px}
.endbox .seal2{border:2.5px solid var(--pink);color:var(--pink);border-radius:8px;width:84px;height:84px;display:grid;place-items:center;font:700 40px/1 var(--zh);transform:rotate(-6deg);margin-bottom:8px}
.endbox h2{font-size:26px;margin:0}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(22,19,15,.35);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .box{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet .sh h3{font-size:20px;margin:0}
.sheet .acts{display:grid;gap:8px;margin-top:14px}
.sheet .acts .btn{justify-content:flex-start;padding:0 16px}
.sheet .acts .btn small{margin-left:auto;font-weight:500;color:var(--muted)}
.sheet .acts .btn.primary small{color:#fff;opacity:.85}
.sheet .card{min-height:0;padding-top:54px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:80;white-space:nowrap}
.toast.show{opacity:.94}
@media(min-width:1024px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const fold=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const icon=(n,c="")=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const fmt=n=>Number(n).toLocaleString("vi-VN");
const pick=a=>a[Math.floor(Math.random()*a.length)];
const touch="ontouchstart" in window;
let toastT;function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1800)}
const DOW=["CN","T2","T3","T4","T5","T6","T7"];
function dayLabel(d){const t=today(),dt=new Date(d*86400000);return d===t?"hôm nay":d===t+1?"ngày mai":`${DOW[dt.getUTCDay()]} ${dt.getUTCDate()}/${dt.getUTCMonth()+1}`}
const POS={n:"danh từ",v:"động từ",adj:"tính từ",adv:"trạng từ",prep:"giới từ",conj:"liên từ",pron:"đại từ",interj:"thán từ",art:"mạo từ",num:"số từ",det:"hạn định từ",determiner:"hạn định từ",phrase:"cụm từ"};
const IV=[1,3,7,18,45,110,270];

// ---------- languages ----------
const LVC={zh:["#d6336c","#c2255c","#a61e4d","#9c36b5","#7048e8","#4263eb","#1971c2","#0b7285","#2b8a3e"],es:["#d6336c","#ae3ec9","#7048e8","#1971c2","#0b7285","#2b8a3e"]};
function lc(k){const i=L().levels.indexOf(k);return i<0?"":LVC[g][i]}
const LANGS={
  zh:{name:"Tiếng Trung",exam:"HSK 3.0",levels:["1","2","3","4","5","6","7","8","9"],label:k=>"HSK "+k,speech:"zh-CN",total:10969,sizes:{"1": 506, "2": 750, "3": 953, "4": 972, "5": 1059, "6": 1123, "7": 1868, "8": 1869, "9": 1869},seal:"熟",
    row:r=>({h:r[0],t:r[1],v:r[2],hv:r[3],ex:r[4],exPy:r[5],exTr:r[6],tl:r[7]}),
    star:c=>[c.h,c.t,c.v,c.hv,c.ex,c.exPy,c.exTr,c.tl],
    src:'Danh sách từ HSK 3.0 (2021): <a href="https://github.com/drkameleon/complete-hsk-vocabulary">complete-hsk-vocabulary</a> · Nghĩa: <a href="https://github.com/ph0ngp/CVDICT">CVDICT</a> (CC BY-SA 4.0) · Hán Việt: <a href="https://github.com/ph0ngp/hanviet-pinyin-words">hanviet-pinyin-words</a> · Câu ví dụ: <a href="https://tatoeba.org">Tatoeba</a> và <a href="https://github.com/NRO2k3/lingua">Lingua</a>. HSK 7–9 là một nhóm chung, được chia 3 phần theo độ phổ biến.'},
  es:{name:"Tây Ban Nha",exam:"DELE",levels:["A1","A2","B1","B2","C1","C2"],label:k=>k,speech:"es-ES",total:6459,sizes:{"A1": 614, "A2": 714, "B1": 1152, "B2": 1554, "C1": 1212, "C2": 1213},seal:"SÉ",
    row:r=>({h:r[0],v:r[1],t:r[2]||"",ex:r[3],exTr:r[4],tl:r[5]}),
    star:c=>[c.h,c.v,c.t,c.ex,c.exTr,c.tl],
    src:'DELE không có danh sách từ vựng chính thức; bộ từ này là bản tham khảo theo khung CEFR. A1–B2: <a href="https://github.com/NRO2k3/lingua">Lingua</a> · C1–C2: <a href="https://github.com/doozan/spanish_data">spanish_data</a> (Wiktionary), nghĩa do Claude biên dịch · Câu ví dụ: <a href="https://tatoeba.org">Tatoeba</a> và Lingua.'}
};
const YES=["Tốt lắm","Nhớ rồi","Chuẩn","Tiếp nào"],NO=["Không sao, gặp lại sau vài thẻ","Sẽ quay lại ngay"];

// ---------- persistent state (same keys as the previous version) ----------
let g=load("fc_lang","zh");if(!LANGS[g])g="zh";
let mode=load("fc_mode","card");if(!["card","type","listen"].includes(mode))mode="card";
const set=load("fc_set",{goal:{zh:20,es:20}});set.goal=set.goal||{zh:20,es:20};
const srs={zh:load("fc_srs_zh",{}),es:load("fc_srs_es",{})};
const stars={zh:load("fc_star_zh",{}),es:load("fc_star_es",{})};
const log=load("fc_log",{});
const cur={zh:String(load("fc_lvl_zh","1")),es:String(load("fc_lvl_es","A1"))};
for(const l of ["zh","es"])if(!LANGS[l].levels.includes(cur[l]))cur[l]=LANGS[l].levels[0];
if(!load("fc_migrated",false)){const t=today();
  for(const k of LANGS.zh.levels)for(const h of load("hskM"+k,[]))if(!srs.zh[h])srs.zh[h]={r:1,i:1,d:t+1,lv:k};
  for(const k of LANGS.es.levels)for(const h of load("deleM"+k,[]))if(!srs.es[h])srs.es[h]={r:1,i:1,d:t+1,lv:k};
  store("fc_srs_zh",srs.zh);store("fc_srs_es",srs.es);store("fc_migrated",true)}
const L=()=>LANGS[g];
const saveSrs=(l=g)=>store("fc_srs_"+l,srs[l]);
function dayLog(l=g){const t=today();log[t]=log[t]||{};log[t][l]=log[t][l]||{n:0,r:0};return log[t][l]}
const dayCount=(d,l=g)=>{const x=log[d]&&log[d][l];return x?x.n+x.r:0};
const anyDay=d=>log[d]&&Object.values(log[d]).some(x=>x.n+x.r>0);
function streak(){let s=0,t=today();if(!anyDay(t))t--;while(anyDay(t)){s++;t--}return s}
function bestStreak(){let best=0,run=0,prev=null;for(const d of Object.keys(log).map(Number).sort((a,b)=>a-b)){if(!anyDay(d))continue;run=prev!==null&&d===prev+1?run+1:1;best=Math.max(best,run);prev=d}return best}
const known=(h,l=g)=>{const r=srs[l][h];return !!r&&r.r>=1};

// ---------- data ----------
const cache={zh:{},es:{}};
function loadLevel(l,k){
  if(cache[l][k])return Promise.resolve(cache[l][k]);
  return fetch(`data/${l}-${k}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(rows=>{
    const list=rows.map(LANGS[l].row);cache[l][k]=list;let ch=false;
    for(const c of list){const r=srs[l][c.h];if(r&&r.lv!==k){r.lv=k;ch=true}}if(ch)saveSrs(l);return list})
  .catch(()=>{toast("Không tải được dữ liệu, hãy kiểm tra mạng");return []});
}
const loadAll=l=>Promise.all(LANGS[l].levels.map(k=>loadLevel(l,k)));
function levelStats(k){let n=0;for(const r of Object.values(srs[g]))if(r.lv===k&&r.r>=1)n++;const t=L().sizes[k]||0;return{n,t,pct:t?n/t*100:0}}
function dueMap(){const t=today(),m={};let total=0;for(const r of Object.values(srs[g]))if(r.d<=t&&r.lv){total++;m[r.lv]=(m[r.lv]||0)+1}return{m,total}}
function newRoom(){return Math.max(0,(set.goal[g]||20)-dayLog().n)}
function newCount(k){const d=cache[g][k]||[];let n=0;for(const c of d)if(!srs[g][c.h])n++;return n}
function nextDue(){const t=today();let d=Infinity,n=0;for(const r of Object.values(srs[g]))if(r.d>t){if(r.d<d){d=r.d;n=1}else if(r.d===d)n++}return d===Infinity?null:{d,n}}

// ---------- routing ----------
const VIEWS=["home","stars","search","stats","settings"];
let view="home";
function go(v){
  if(!VIEWS.includes(v))v="home";view=v;
  for(const x of VIEWS)$("v-"+x).hidden=x!==v;
  document.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go===v));
  if(location.hash!=="#"+v)history.replaceState(null,"","#"+v);
  render();window.scrollTo(0,0);
  if(v==="search")openSearch();
}
function setLang(l){if(!LANGS[l]||l===g)return;g=l;store("fc_lang",g);$("res").innerHTML="";$("q").value="";boot();if(view==="search")openSearch()}
function langsHtml(){return Object.entries(LANGS).map(([k,x])=>`<button data-lang="${k}" class="${k===g?"on":""}" aria-pressed="${k===g}">${x.name}</button>`).join("")}
function chrome(){
  document.querySelectorAll("[data-langs]").forEach(el=>el.innerHTML=langsHtml());
  const {total}=dueMap();
  document.querySelectorAll("[data-due]").forEach(el=>{el.hidden=!total;el.textContent=total>99?"99+":total});
  document.querySelectorAll("[data-streak]").forEach(el=>el.innerHTML=`<b>${streak()} ngày</b> liên tiếp`);
}
function render(){chrome();({home:renderHome,stars:renderStars,search:()=>{},stats:renderStats,settings:renderSettings})[view]()}

// ---------- home ----------
function todayPlan(){const {total}=dueMap();const fresh=Math.min(newRoom(),newCount(cur[g]));return{due:total,fresh,all:total+fresh}}
function renderHome(){
  const cfg=L(),p=todayPlan(),{m}=dueMap(),t=today(),date=new Date();
  const ds=`${["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"][date.getDay()]}, ${date.getDate()}/${date.getMonth()+1}`;
  const mins=Math.max(1,Math.round(p.all*20/60));
  let hero;
  if(!cache[g][cur[g]])hero=`<div class="today" data-seal="${esc(cfg.seal)}"><div class="n" style="font-size:22px">Đang tải…</div></div>`;
  else if(p.all){
    hero=`<div class="today" data-seal="${esc(cfg.seal)}"><div class="row"><div><div class="n">${fmt(p.all)}<small>thẻ cần học</small></div>
      <div class="meta"><span>${icon("review","s")}${p.due} ôn tập</span><span>${icon("book","s")}${p.fresh} từ mới · ${esc(cfg.label(cur[g]))}</span><span>${icon("clock","s")}khoảng ${mins} phút</span></div></div>

function forecast(days){
  const t=today(),cnt=Array(days).fill(0);for(const r of Object.values(srs[g])){const k=Math.max(0,r.d-t);if(k<days)cnt[k]++}
  const mx=Math.max(1,...cnt);
  return `<div class="fc" style="grid-template-columns:repeat(${days},minmax(0,1fr));gap:${days>7?4:8}px">`+cnt.map((n,k)=>{const dt=new Date((t+k)*86400000);
    return `<div><b>${n}</b><i style="height:${n?Math.max(6,n/mx*76):3}%"></i><span>${k===0?"Nay":days>7?dt.getUTCDate():DOW[dt.getUTCDay()]}</span></div>`}).join("")+`</div>`;
}
function streakPanel(){
  const t=today(),start=t-27,fd=(new Date(start*86400000).getUTCDay()+6)%7;
  let cells=["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<span class="dow">${x}</span>`).join("")+Array(fd).fill('<span style="visibility:hidden"></span>').join("");
  for(let d=start;d<=t;d++){const n=dayCount(d),c=n===0?"":n<10?"h1":n<30?"h2":"h3";const dt=new Date(d*86400000);cells+=`<span class="${c}${d===t?" now":""}" title="${dt.getUTCDate()}/${dt.getUTCMonth()+1}: ${n} thẻ"></span>`}
  return `<div class="panel"><h2>Chuỗi ngày học <small>4 tuần qua</small></h2><div class="streakline"><b>${streak()} ngày</b><span class="muted">dài nhất ${bestStreak()} ngày</span></div><div class="heat">${cells}</div></div>`;
}
function wodPanel(){
  const pool=cache[g][cur[g]]||[];if(!pool.length)return "";
  const c=pool[(today()*2654435761>>>0)%pool.length];
  return `<div class="panel wod"><h2>Từ của ngày <small>${esc(L().label(cur[g]))}</small></h2><div class="w ${g==="zh"?"zh-t":""}">${esc(c.h)}</div>

function openSearch(){

let qT;$("q").addEventListener("input",()=>{clearTimeout(qT);qT=setTimeout(doSearch,150)});
function doSearch(){
  const raw=$("q").value.trim();if(!raw){$("res").innerHTML="";return}
  const q=fold(raw),qn=q.replace(/[^a-z0-9]/g,""),out=[];
  for(const k of L().levels)for(const c of cache[g][k]||[]){
    const fh=fold(c.h),fv=fold(c.v),fhv=c.hv?fold(c.hv):"",ft=g==="zh"?fold(c.t).replace(/[^a-z]/g,""):"";
    let rank=-1;
    if(c.h===raw||fh===q)rank=0;else if(fhv===q||(qn&&ft===qn))rank=1;
    else if(fv.split(/[;,]\s*/).some(x=>x.replace(/^\(.*?\)\s*/,"")===q))rank=2;
    else if(c.h.includes(raw)||fh.includes(q)||(qn&&ft.startsWith(qn))||fhv.includes(q))rank=3;else if(fv.includes(q))rank=4;
    if(rank>=0)out.push([rank,k,c]);
  }
  out.sort((a,b)=>a[0]-b[0]);
  $("res").innerHTML=out.length?out.slice(0,80).map(([,k,c])=>rowHtml(c,k)).join("")+(out.length>80?`<li class="empty">… và ${out.length-80} kết quả khác</li>`:""):`<li class="empty">Không tìm thấy từ nào</li>`;
}

// ---------- session ----------
// S.items: [{c,k}]; queue types use S.q (indices into items); browse walks S.i
const S={open:false};
const TYPE_LABEL={today:"Ôn tập hôm nay",known:"Ôn từ đã thuộc",browse:"Xem toàn bộ",stars:"Ôn từ khó",extra:"Học thêm từ mới"};
async function startSession(type,k){
  closeSheet();const cfg=L(),t=today();let items=[];
  if(type==="today"||type==="extra"){
    const {m}=dueMap();const lv=[...new Set([...Object.keys(m),cur[g]])];await Promise.all(lv.map(x=>loadLevel(g,x)));
    const due=[];if(type==="today")for(const x of lv)for(const c of cache[g][x]||[]){const r=srs[g][c.h];if(r&&r.d<=t)due.push({c,k:x,d:r.d})}
    if(type==="today"&&due.length<dueMap().total){await loadAll(g);due.length=0;for(const x of L().levels)for(const c of cache[g][x]||[]){const r=srs[g][c.h];if(r&&r.d<=t)due.push({c,k:x,d:r.d})}}
    due.sort((a,b)=>a.d-b.d);
    const room=type==="extra"?10:newRoom(),fresh=[];
    for(const c of cache[g][cur[g]]||[]){if(fresh.length>=room)break;if(!srs[g][c.h])fresh.push({c,k:cur[g]})}
    items=[...due,...fresh];
  }else if(type==="known"){await loadLevel(g,k);items=(cache[g][k]||[]).filter(c=>known(c.h)).map(c=>({c,k}));for(let a=items.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[items[a],items[b]]=[items[b],items[a]]}}
  else if(type==="browse"){await loadLevel(g,k);items=(cache[g][k]||[]).map(c=>({c,k}))}
  else if(type==="stars"){items=Object.values(stars[g]).map(r=>({c:cfg.row(r),k:levelOf(r[0])}))}
  Object.assign(S,{open:true,type,k,items,q:items.map((_,n)=>n),i:0,hist:[],done:0,total:items.length,flipped:false,typed:null});
  $("session").classList.add("open");document.body.style.overflow="hidden";$("sCheer").textContent="";$("session").scrollTop=0;
  sRender(false);if(mode==="listen")setTimeout(sSpeak,250);
}
function closeSession(){S.open=false;$("session").classList.remove("open");document.body.style.overflow="";try{speechSynthesis.cancel()}catch(e){}render()}
const isQ=()=>S.type!=="browse";
function curItem(){return isQ()?S.items[S.q[0]]:S.items[S.i]}
function keepsSchedule(r){return S.type!=="today"&&S.type!=="extra"&&r&&r.r>=1&&r.d>today()}
function sRender(anim){
  const cfg=L(),it=curItem(),card=$("sCard");
  for(const b of $("modes").children){b.classList.toggle("on",b.dataset.m===mode);b.setAttribute("aria-pressed",b.dataset.m===mode)}
  const pct=isQ()?(S.total?S.done/S.total*100:100):(S.items.length?(S.i+1)/S.items.length*100:0);
  $("sProg").style.width=pct+"%";
  $("sCount").textContent=isQ()?`${Math.min(S.done+(it?1:0),S.total)} / ${S.total}`:`${S.i+1} / ${S.items.length}`;
  $("sLabel").textContent=`${TYPE_LABEL[S.type]}${S.k&&(S.type==="known"||S.type==="browse")?" · "+cfg.label(S.k):""}`;
  $("sBack").disabled=isQ()?!S.hist.length:S.i===0;
  $("sNext").innerHTML=(isQ()?"Bỏ qua":"Thẻ sau")+icon("right","s");
  $("sNext").disabled=!it||(isQ()?S.q.length<2:S.i>=S.items.length-1);
  card.className="card";card.style.transform="";card.style.removeProperty("--lc");
  if(!it){
    const nx=nextDue();
    card.innerHTML=`<div class="endbox"><div class="seal2">${g==="zh"?"熟":"✓"}</div><h2>${S.total?"Xong rồi":"Chưa có thẻ nào"}</h2>
      <div class="muted">${S.total?`Bạn đã ôn ${S.done} / ${S.total} thẻ.`:"Phần này hiện chưa có thẻ để học."}${nx?`<br>Lần ôn tới: ${dayLabel(nx.d)} · ${nx.n} từ.`:""}</div></div>`;
    $("sGrade").innerHTML=`<button class="one" data-g="close">Về trang chủ</button>`;return;
  }
  const c=it.c,label=it.k?cfg.label(it.k):"";if(lc(it.k))card.style.setProperty("--lc",lc(it.k));
  let body;
  if(mode==="type"&&!S.typed){
    body=(g==="zh"?`<div class="big-zh" style="font-size:clamp(60px,18vw,88px)">${esc(c.h)}</div><div class="hint">Gõ pinyin của từ này (không cần dấu thanh)</div>`
      :`${c.t?`<div class="b-pos">${esc(POS[c.t]||c.t)}</div>`:""}<div class="b-vi" style="font-size:24px">${esc(c.v)}</div><div class="hint">Gõ từ tiếng Tây Ban Nha (el/la không bắt buộc)</div>`)
      +`<form class="typing" id="tform"><input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Câu trả lời"><button class="btn primary" style="min-height:50px">Kiểm tra</button></form>`;
  }else if(mode==="type"){body=backHtml(c,S.full)+`<div class="result ${S.typed.ok?"ok":"bad"}" role="status">${esc(S.typed.msg)}</div>`}
  else if(mode==="listen"&&!S.flipped){body=`<button class="listen" data-say aria-label="Nghe lại">${icon("vol")}</button><div class="hint">Nghe rồi đoán từ và nghĩa · chạm thẻ để xem đáp án</div>`}
  else body=S.flipped?backHtml(c,S.full):frontHtml(c)+`<div class="hint">Chạm để lật thẻ</div>`;
  card.innerHTML=cardChrome(c,label,S.flipped||!!S.typed)+body;
  if(anim){void card.offsetWidth;card.classList.add("pop")}
  const r=srs[g][c.h],step=r?Math.min(r.r||0,IV.length-1):0;
  const yesHint=keepsSchedule(r)?"Giữ lịch ôn hiện tại":`Ôn lại sau ${IV[step]} ngày`;
  if(mode==="type"&&S.typed)$("sGrade").innerHTML=`<button class="one" data-g="next"><span class="gt">Tiếp tục<kbd class="d-only" style="opacity:.7">Enter</kbd></span></button>`;
  else if(mode==="type")$("sGrade").innerHTML=`<button class="no" data-g="reveal">Không biết<small>Xem đáp án</small></button><button class="yes" disabled>Đã nhớ<small>Gõ rồi bấm Kiểm tra</small></button>`;
  else $("sGrade").innerHTML=`<button class="no" data-g="no"><span class="gt">Chưa nhớ<kbd class="d-only">1</kbd></span><small>Gặp lại sau vài thẻ</small></button><button class="yes" data-g="yes"><span class="gt">Đã nhớ<kbd class="d-only" style="opacity:.8">2</kbd></span><small>${yesHint}</small></button>`;
  if(mode==="type"&&!S.typed&&!touch)setTimeout(()=>{const inp=$("tin");if(inp)inp.focus()},30);
}
function sGrade(yes){
  const it=curItem();if(!it)return;const c=it.c,t=today(),r=srs[g][c.h],dl=dayLog();
  S.hist.push({n:isQ()?S.q[0]:S.i,graded:true,rec:r?{...r}:null,cnt:r?"r":"n",yes});
  if(!r)dl.n++;else dl.r++;
  if(yes&&keepsSchedule(r)){}
  else if(yes){const step=r?Math.min(r.r||0,IV.length-1):0;srs[g][c.h]={r:(r?r.r:0)+1,i:IV[step],d:t+IV[step],lv:it.k||(r&&r.lv)}}
  else srs[g][c.h]={r:0,i:0,d:t,lv:it.k||(r&&r.lv)};
  saveSrs();store("fc_log",log);
  if(isQ()){const n=S.q.shift();if(yes)S.done++;else S.q.splice(Math.min(4,S.q.length),0,n)}
  else if(S.i<S.items.length-1)S.i++;
  $("sCheer").textContent=yes?pick(YES):pick(NO);
  S.flipped=false;S.typed=null;S.full=false;sRender(true);if(mode==="listen")setTimeout(sSpeak,250);
}
function sBack(){
  if(!isQ()){if(S.i>0){S.i--;S.flipped=false;S.typed=null;S.full=false;$("sCheer").textContent="";sRender(true)}return}
  const h=S.hist.pop();if(!h)return;
  if(h.graded){const c=S.items[h.n].c;if(h.rec)srs[g][c.h]=h.rec;else delete srs[g][c.h];const dl=dayLog();dl[h.cnt]=Math.max(0,dl[h.cnt]-1);saveSrs();store("fc_log",log);if(h.yes)S.done=Math.max(0,S.done-1);$("sCheer").textContent="Đã quay lại thẻ trước, bạn có thể chấm lại"}
  else $("sCheer").textContent="";
  const at=S.q.lastIndexOf(h.n);if(at>=0)S.q.splice(at,1);S.q.unshift(h.n);
  S.flipped=false;S.typed=null;S.full=false;sRender(true);
}
function sNext(){
  if(!curItem())return;
  if(isQ()){if(S.q.length<2)return;S.hist.push({n:S.q[0],graded:false});S.q.push(S.q.shift())}else{if(S.i>=S.items.length-1)return;S.i++}
  S.flipped=false;S.typed=null;S.full=false;$("sCheer").textContent="";sRender(true);if(mode==="listen")setTimeout(sSpeak,250);
}
function sFlip(){if(!curItem()||mode==="type")return;S.flipped=!S.flipped;sRender(true)}
function sSpeak(){const it=curItem();if(it)speak(it.c.h)}
function checkTyped(){
  const it=curItem(),inp=$("tin");if(!it||!inp)return;const a=inp.value.trim();if(!a){inp.focus();return}
  const c=it.c;let ok=false,msg;
  if(g==="zh"){const n=s=>fold(s).replace(/u:/g,"v").replace(/ü/g,"v").replace(/[^a-z]/g,"");ok=n(a)===n(c.t);msg=ok?`Đúng rồi · ${c.t}`:`Đáp án: ${c.t}`}
  else{const st=s=>s.toLowerCase().replace(/^(el|la|los|las|un|una)\s+/,"").replace(/[¡!¿?.,]/g,"").trim();const A=st(a),B=st(c.h);
    if(A===B){ok=true;msg=`Chính xác · ${c.h}`}else if(fold(A)===fold(B)){ok=true;msg=`Gần đúng, chú ý dấu · ${c.h}`}else msg=`Đáp án: ${c.h}`}
  S.typed={ok,msg};sRender(true);sSpeak();
}

// ---------- events ----------
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-word]");if(!t||t.closest("#session"))return;
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.lang){setLang(t.dataset.lang);return}
  if(t.dataset.level){openLevel(t.dataset.level);return}
  if(t.dataset.start){startSession(t.dataset.start,t.dataset.k);return}
  if(t.dataset.setcur){cur[g]=t.dataset.setcur;store("fc_lvl_"+g,cur[g]);closeSheet();toast(`Từ mới sẽ lấy từ ${L().label(cur[g])}`);render();return}
  if(t.dataset.reset){if(t.dataset.armed){for(const c of cache[g][t.dataset.reset]||[])delete srs[g][c.h];saveSrs();closeSheet();toast("Đã xoá tiến độ "+L().label(t.dataset.reset));render()}
    else{t.dataset.armed="1";t.textContent="Bấm lần nữa để xác nhận xoá";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="Xoá tiến độ cấp này"}},3000)}return}
  if(t.dataset.word){const i=t.dataset.word.indexOf("|");openWord(t.dataset.word.slice(0,i),t.dataset.word.slice(i+1));return}
  if(t.hasAttribute("data-close")){closeSheet();return}
  if(wordIt&&t.closest("#wCard")){
    if(t.hasAttribute("data-say"))speak(wordIt.c.h);
    if(t.hasAttribute("data-star")){toggleStar(wordIt.c);const on=!!stars[g][wordIt.c.h];t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);if(view==="stars")renderStars()}
  }
});
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))closeSheet()});
$("sClose").onclick=closeSession;$("sBack").onclick=sBack;$("sNext").onclick=sNext;
$("modes").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;store("fc_mode",mode);S.flipped=false;S.typed=null;S.full=false;sRender(true);if(mode==="listen")sSpeak()});
$("sGrade").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const a=b.dataset.g;
  if(a==="yes")sGrade(true);else if(a==="no")sGrade(false);else if(a==="close")closeSession();
  else if(a==="next"){const ok=S.typed.ok;S.typed=null;sGrade(ok)}
  else if(a==="reveal"){const c=curItem().c;S.typed={ok:false,msg:`Đáp án: ${c.h}${g==="zh"?" · "+c.t:""}`};sRender(true);sSpeak()}});
let swiped=false;
$("sCard").addEventListener("click",e=>{
  if(swiped){swiped=false;return}
  const it=curItem();if(!it)return;
  if(e.target.closest("[data-say]")){sSpeak();return}
  if(e.target.closest("[data-star]")){toggleStar(it.c);sRender(false);return}
  if(e.target.closest("[data-more]")){S.full=true;sRender(false);return}
  if(e.target.closest("form,input,button"))return;
  sFlip();
});
$("sCard").addEventListener("submit",e=>{e.preventDefault();checkTyped()});
{ // swipe or drag the card to grade
  let sx=0,sy=0,dx=0,active=false,lock=null;const stage=$("sStage");
  const start=(x,y,t)=>{if(!curItem()||mode==="type"||t.closest("button,input,form"))return;sx=x;sy=y;dx=0;active=true;lock=null};
  const move=(x,y,e)=>{if(!active)return;dx=x-sx;const dy=y-sy;if(lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dx)>Math.abs(dy)?"x":"y";if(lock!=="x")return;if(e.cancelable)e.preventDefault();
    const c=$("sCard");c.classList.add("drag");c.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;$("swr").style.opacity=Math.max(0,Math.min(1,dx/90));$("swl").style.opacity=Math.max(0,Math.min(1,-dx/90))};
  const end=()=>{if(!active)return;active=false;const c=$("sCard");c.classList.remove("drag");$("swr").style.opacity=0;$("swl").style.opacity=0;
    if(lock==="x"){swiped=true;setTimeout(()=>swiped=false,300)}
    if(lock==="x"&&Math.abs(dx)>80)sGrade(dx>0);else{c.classList.add("back");c.style.transform="";setTimeout(()=>c.classList.remove("back"),260)}};
  stage.addEventListener("touchstart",e=>start(e.touches[0].clientX,e.touches[0].clientY,e.target),{passive:true});
  stage.addEventListener("touchmove",e=>move(e.touches[0].clientX,e.touches[0].clientY,e),{passive:false});
  stage.addEventListener("touchend",end);stage.addEventListener("touchcancel",end);
  stage.addEventListener("mousedown",e=>{if(e.button===0)start(e.clientX,e.clientY,e.target)});
  window.addEventListener("mousemove",e=>move(e.clientX,e.clientY,e));window.addEventListener("mouseup",end);
}
document.addEventListener("keydown",e=>{
  const typing=["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName);
  if($("sheet").classList.contains("open")){if(e.key==="Escape")closeSheet();return}
  if(S.open){
    if(e.key==="Escape"){closeSession();return}
    if(typing)return;
    if(mode==="type"&&S.typed&&e.key==="Enter"){e.preventDefault();const ok=S.typed.ok;S.typed=null;sGrade(ok);return}
    if(!curItem()){if(e.key==="Enter")closeSession();return}
    if(e.key===" "){e.preventDefault();sFlip()}
    else if(e.key==="ArrowLeft")sBack();else if(e.key==="ArrowRight")sNext();
    else if((e.key==="1"||e.key==="2")&&mode!=="type")sGrade(e.key==="2");
    else if(e.key==="s"||e.key==="S")sSpeak();
    return;
  }
  if(typing)return;
  if(e.key==="Enter"&&view==="home"){const b=document.querySelector("#v-home [data-start]");if(b){e.preventDefault();b.click()}}
  else if(e.key==="/"){e.preventDefault();go("search")}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(LANGS[h]){setLang(h);go("home")}else if(VIEWS.includes(h)&&h!==view)go(h)});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

// ---------- boot ----------
function boot(){
  const l=g;render();
  loadLevel(l,cur[l]).then(()=>{if(g===l&&!S.open)render()});
  if(Object.values(srs[l]).some(r=>!r.lv))loadAll(l).then(()=>{if(g===l&&!S.open)render()});
}
const h0=location.hash.slice(1);
if(LANGS[h0]){g=h0;store("fc_lang",g)}
view=VIEWS.includes(h0)?h0:"home";
for(const x of VIEWS)$("v-"+x).hidden=x!==view;
document.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go===view));
boot();if(view==="search")openSearch();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
